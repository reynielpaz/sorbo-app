name: Keep Supabase Alive

# Evita que el proyecto de Supabase (capa gratuita) se pause por inactividad.
# La capa gratuita pausa el proyecto tras ~7 días sin actividad, así que
# generamos una petición ligera a la API REST de forma programada (semanal).
#
# Requiere configurar dos secrets en el repositorio:
#   - SUPABASE_URL       (p. ej. https://xxxx.supabase.co)
#   - SUPABASE_ANON_KEY  (la clave anon pública del proyecto)

on:
  schedule:
    # Una vez por semana: lunes a las 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Keep database active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL y/o SUPABASE_ANON_KEY."
            exit 1
          fi
          curl --fail --silent --show-error \
            "${SUPABASE_URL%/}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
          echo "Supabase ping OK."
